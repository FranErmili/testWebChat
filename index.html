<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Webchat - Sucursal Virtual</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Contenedor del Iframe del Chat */
        #chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            height: 600px;
            display: none; /* Inicia oculto */
            border: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            overflow: hidden;
            z-index: 9999;
        }

        #chat-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sucursal Virtual</h1>
        <p>Selecciona una opción para iniciar la consulta:</p>
        
        <div class="buttons-container">
            <!-- Cada botón pasa un parámetro de negocio diferente -->
            <button onclick="abrirChat('solicitud_bajas')">Solicitud de Bajas</button>
            <button onclick="abrirChat('facturacion')">Detalles de Facturación</button>
            <button onclick="abrirChat('soporte_tecnico')">Soporte Técnico</button>
        </div>
    </div>

    <!-- Contenedor flotante para el Chat -->
    <div id="chat-container">
        <iframe id="chat-iframe" src="about:blank"></iframe>
    </div>
